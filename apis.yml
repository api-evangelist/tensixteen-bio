name: TenSixteen Bio
description: 'TenSixteen Bio is a San Francisco-based clinical-stage biotechnology company pioneering
  the study of somatic mosaicism and clonal hematopoiesis of indeterminate potential (CHIP) to
  discover and develop novel therapeutics for age-related diseases including cancer and cardiovascular
  disease. Founded by CEO Mark Chao and launched in 2022 with a $40M Series A from Foresite Capital
  and GV (formerly Google Ventures), the company combines human genetics, functional genomics and
  next-generation-sequencing (NGS) based assays to identify CHIP-linked mutations and translate them
  into companion diagnostics and precision-medicine treatments. This profile was added to the API
  Evangelist network as a portfolio-company lead; as a therapeutics and diagnostics company it
  publishes no public developer API surface.'
